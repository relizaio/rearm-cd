mode: STANDALONE # options: STANDALONE, EXISTING_ARGO, NEW_ARGO
imagePullPolicy: IfNotPresent
images:
  rearmcdImage: registry.relizahub.com/library/rearm-cd-app:26.03.48@sha256:2cb74272852a4922a52536197e1f5c8399a87fd37afa481c43396dee91073ca2

enableWatcher: true
watcherHelmVersion: "0.1.23"
watcherHelmChart: "oci://registry.relizahub.com/library/rearm-watcher"
# Adds --force-conflicts to helm upgrades issued by ReARM CD.
#
# Server-side apply refuses to change a field owned by a different field
# manager, so if someone edits a ReARM CD-managed workload out of band
# (`kubectl edit`, `kubectl set image`) every later reconcile fails with
# "conflict occurred while applying object ... conflict with \"kubectl-edit\""
# and the deployment stays wedged until someone intervenes manually.
# Setting this to true lets ReARM CD reclaim ownership and recover on its own.
#
# Left false by default deliberately: it makes ReARM CD overwrite out-of-band
# changes without warning, which is what you want while recovering a wedge and
# not what you want as a standing policy. Prefer turning it on to unstick, then
# back off.
helmForceConflicts: false

backup:
  enabled: false
  schedule: "0 2 * * *" # cron schedule for backup, default is 2 AM daily
  awsRegion: "ca-central-1"
  prefix: "rearm-cd-backup"

rbac:
  createServiceAccount: true
  createClusterRole: true
  createClusterRoleBinding: true
  # Override the service account name. When empty, defaults to <namespace>-<release>-rearm-cd.
  # Set this to a pre-existing service account name when createServiceAccount is false.
  serviceAccountName: ""
  # To restrict ReARM CD to specific namespaces instead of cluster-wide access,
  # list them here. When set, namespace-scoped Roles and RoleBindings are created
  # instead of ClusterRole/ClusterRoleBinding.
  # IMPORTANT: When using namespace-scoped RBAC, you MUST include the namespace where
  # ReARM CD itself runs (the release namespace) in this list for normal operations.
  # namespaces: []
  # Example:
  # namespaces:
  #   - rearm-cd      # Required: ReARM CD's own namespace
  #   - default
  #   - staging
  #   - production

storageSize: 1G

create_secret_in_chart: none # regular, none
rearmUri: https://demo.rearmhq.com
rearmApiId: placeholder # instance api id
rearmApiKey: placeholder # instance api key
argoHelmVersion: 6.6.0
